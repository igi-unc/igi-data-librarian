[project]
name = "data-librarian"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "slack-sdk==3.43.0",
    "slack-bolt==1.30.0",
    "slack-cli-hooks==0.3.0",
    "anthropic==2.4.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
dev = [
    "data-librarian[test]",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
include = ["agent*", "instance*", "listeners*", "registry*", "thread_context*"]

[tool.ruff]
[tool.ruff.lint]
[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
